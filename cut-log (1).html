<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CUT LOG — 커팅 기록</title>
<style>
:root{
  --bg:#101418; --surface:#1A2028; --surface2:#222A34; --line:#2C3540;
  --text:#E8ECF1; --muted:#7A8694; --dim:#4E5866;
  --blue:#4A90D9;   /* 20kg 플레이트 */
  --red:#E5484D;    /* 25kg 플레이트 · 중량 하락 경고 */
  --green:#4CAF6D;  /* 10kg 플레이트 · 유지/증량 */
  --yellow:#E8B93A; /* 15kg 플레이트 */
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* 헤더 */
header{padding:22px 0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between}
h1{font-family:var(--mono);font-size:20px;letter-spacing:2px;font-weight:700}
h1 .accent{color:var(--blue)}
.goal{font-family:var(--mono);font-size:12px;color:var(--muted)}
.goal b{color:var(--green);font-weight:600}

/* 탭 */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--dim);font-family:inherit;font-size:13px;font-weight:600;padding:14px 0;cursor:pointer}
nav button.on{color:var(--blue)}
nav button .ic{display:block;font-size:17px;margin-bottom:2px}

.tab{display:none}.tab.on{display:block}

/* 요일 선택 (플레이트 시그니처) */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.day-btn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 6px 12px;cursor:pointer;text-align:center;color:var(--text);font-family:inherit;transition:border-color .15s}
.day-btn .plate{width:34px;height:34px;border-radius:50%;margin:0 auto 8px;border:5px solid;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;background:var(--bg)}
.day-btn:nth-child(1) .plate{border-color:var(--red);color:var(--red)}
.day-btn:nth-child(2) .plate{border-color:var(--blue);color:var(--blue)}
.day-btn:nth-child(3) .plate{border-color:var(--yellow);color:var(--yellow)}
.day-btn:nth-child(4) .plate{border-color:var(--green);color:var(--green)}
.day-btn .nm{font-size:13px;font-weight:700}
.day-btn .sub{font-size:11px;color:var(--muted)}
.day-btn.sel{border-color:var(--blue);background:var(--surface2)}

/* 운동 카드 */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ex-name{font-weight:700;font-size:15px}
.ex-target{font-family:var(--mono);font-size:12px;color:var(--muted)}
.last{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-bottom:10px}
.last b{color:var(--muted);font-weight:600}
.set-row{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.set-no{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.set-row input{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:16px;padding:10px 8px;text-align:center;width:100%}
.set-row input:focus{outline:none;border-color:var(--blue)}
.set-row input.down{border-color:var(--red);color:var(--red)}
.set-row input.up{border-color:var(--green)}
.chk{width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--dim);font-size:16px;cursor:pointer}
.chk.done{background:var(--green);border-color:var(--green);color:#0d1512}
.flag{font-family:var(--mono);font-size:11px;margin:-2px 0 8px 42px}
.flag.down{color:var(--red)}.flag.up{color:var(--green)}
.same-row{display:flex;gap:18px;margin:2px 0 2px 42px}
.same-row label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.same-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue)}
.sec{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;color:var(--dim);margin:26px 0 4px;text-transform:uppercase}

.cardio{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.cardio span{font-size:14px;color:var(--muted)}

.btn{width:100%;background:var(--blue);border:none;border-radius:14px;color:#fff;font-family:inherit;font-size:16px;font-weight:700;padding:15px;cursor:pointer;margin:6px 0 24px}
.btn:disabled{background:var(--surface2);color:var(--dim)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:600}

/* 기록 탭 */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.sess-head{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.sess-head .d{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sess-head .t{font-weight:700;font-size:14px}
.sess-body{border-top:1px solid var(--line);padding:12px 14px;display:none}
.sess.open .sess-body{display:block}
.sess-body .r{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.sess-body .r .v{font-family:var(--mono);color:var(--muted);font-size:12px}
.del{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;font-family:inherit;margin-top:8px}

/* 체중 탭 */
.w-input{display:flex;gap:10px;margin:18px 0}
.w-input input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--text);font-family:var(--mono);font-size:18px;padding:13px;text-align:center}
.w-input input:focus{outline:none;border-color:var(--blue)}
.w-input button{background:var(--blue);border:none;border-radius:14px;color:#fff;font-weight:700;padding:0 24px;font-size:15px;cursor:pointer;font-family:inherit}
#chart{width:100%;height:140px;margin:6px 0 14px}
.w-row{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:14px}
.w-row .d{color:var(--muted);font-size:12.5px}
.w-row .diff{font-size:12px;margin-left:8px}
.w-row .diff.down{color:var(--green)}.w-row .diff.up{color:var(--red)}

.empty{text-align:center;color:var(--dim);padding:40px 0;font-size:14px}
.note{font-size:12px;color:var(--dim);margin:4px 0 16px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#0d1512;font-weight:700;font-size:14px;padding:10px 20px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>CUT<span class="accent">·</span>LOG</h1>
      <div class="goal">73kg → <b>69kg</b> · 목표 11%</div>
    </div>
  </header>

  <!-- 오늘 운동 -->
  <section id="tab-work" class="tab on">
    <div class="days" id="days"></div>
    <div id="workout"></div>
  </section>

  <!-- 기록 -->
  <section id="tab-hist" class="tab">
    <div id="hist"></div>
  </section>

  <!-- 체중 · 단백질 -->
  <section id="tab-weight" class="tab">
    <div class="sec">체중</div>
    <div class="w-input">
      <input type="number" step="0.1" inputmode="decimal" id="w-kg" placeholder="오늘 공복 체중 (kg)">
      <button onclick="addWeight()">기록</button>
    </div>
    <p class="note">매주 같은 요일 아침 공복에 재는 게 가장 정확해요. 주당 −0.4~0.5kg이 목표 페이스입니다.</p>
    <svg id="chart" viewBox="0 0 340 140" preserveAspectRatio="none"></svg>
    <div id="w-list"></div>

    <div class="sec">단백질 섭취</div>
    <div class="w-input">
      <input type="number" inputmode="numeric" id="p-g" placeholder="오늘 총 단백질 (g)">
      <button onclick="addProtein()">기록</button>
    </div>
    <p class="note">목표는 하루 130g 이상. 달걀 3개 ≈ 18g · 닭가슴살 200g ≈ 45g · 저녁 메인 ≈ 50g · 쉐이크 1스쿱 ≈ 25g</p>
    <div id="p-list"></div>
  </section>
</div>

<nav>
  <button class="on" data-t="work"><span class="ic">🏋️</span>오늘 운동</button>
  <button data-t="hist"><span class="ic">📋</span>기록</button>
  <button data-t="weight"><span class="ic">⚖️</span>체중</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const PROGRAM = {
  '상체A': {sub:'무게 중심', cardio:null, ex:[
    {n:'스미스 벤치프레스', s:4, r:'5-6', t:'77.5'},
    {n:'바벨로우', s:4, r:'6-8', t:'40'},
    {n:'덤벨 숄더프레스', s:3, r:'6-8', t:'16'},
    {n:'랫풀다운 / 턱걸이', s:3, r:'8-10', t:'55'},
    {n:'덤벨컬', s:3, r:'10-12', t:'12'},
    {n:'케이블 푸시다운', s:3, r:'10-12', t:'20'},
  ]},
  '하체A': {sub:'무게 중심', cardio:'인클라인 워킹 15분 · 경사 8~10% · 심박 120~135', ex:[
    {n:'백스쿼트', s:4, r:'5-6', t:'57.5'},
    {n:'루마니안 데드리프트', s:3, r:'8', t:'50'},
    {n:'레그프레스', s:3, r:'10', t:'120'},
    {n:'레그컬', s:3, r:'12', t:'35'},
    {n:'카프레이즈', s:4, r:'15', t:'40'},
  ]},
  '상체B': {sub:'볼륨 중심', cardio:null, ex:[
    {n:'인클라인 덤벨프레스', s:4, r:'8-10', t:'24'},
    {n:'시티드 케이블로우', s:4, r:'10', t:'50'},
    {n:'사이드 레터럴레이즈', s:4, r:'12-15', t:'8'},
    {n:'페이스풀', s:3, r:'15', t:'15'},
    {n:'덤벨컬 (슈퍼세트)', s:3, r:'12', t:'10'},
    {n:'푸시다운 (슈퍼세트)', s:3, r:'12', t:'17.5'},
  ]},
  '하체B': {sub:'볼륨+유산소', cardio:'사이클 20분 · 80~90rpm · 심박 115~130', ex:[
    {n:'레그프레스 (볼륨)', s:4, r:'8-10', t:'110'},
    {n:'힙쓰러스트', s:3, r:'10', t:'70'},
    {n:'레그익스텐션', s:3, r:'12', t:'40'},
    {n:'행잉 레그레이즈', s:3, r:'15', t:''},
  ]},
};

const KEY = 'cutlog-data';
let DATA = { sessions: [], weights: [], protein: [] };
let curDay = null;

// ---------- storage ----------
async function load(){
  try{
    const res = await window.storage.get(KEY);
    if(res && res.value) DATA = JSON.parse(res.value);
  }catch(e){ /* 첫 실행: 저장된 데이터 없음 */ }
  if(!DATA.protein) DATA.protein = [];
  renderDays(); renderHist(); renderWeights(); renderProtein();
}
async function save(){
  try{ await window.storage.set(KEY, JSON.stringify(DATA)); }
  catch(e){ toast('저장 실패 — 다시 시도해주세요'); }
}

// ---------- 유틸 ----------
const today = () => new Date().toISOString().slice(0,10);
const fmt = d => d.slice(5).replace('-','/');
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function lastSession(day, exName){
  for(let i = DATA.sessions.length-1; i >= 0; i--){
    const s = DATA.sessions[i];
    if(s.day !== day) continue;
    const e = s.exercises.find(x => x.name === exName);
    if(e && e.sets.some(t => t.w || t.r)) return e;
  }
  return null;
}
function topWeight(ex){
  return Math.max(0, ...ex.sets.map(s => parseFloat(s.w) || 0));
}

// ---------- 오늘 운동 ----------
function renderDays(){
  const el = document.getElementById('days');
  el.innerHTML = Object.keys(PROGRAM).map(d => `
    <button class="day-btn ${curDay===d?'sel':''}" onclick="pickDay('${d}')">
      <div class="plate">${d.slice(-1)}</div>
      <div class="nm">${d.slice(0,2)}</div>
      <div class="sub">${PROGRAM[d].sub}</div>
    </button>`).join('');
}
function pickDay(d){
  curDay = d; renderDays();
  const p = PROGRAM[d];
  let html = '';
  p.ex.forEach((ex,ei) => {
    const last = lastSession(d, ex.n);
    const lastTxt = last
      ? '지난 기록 <b>' + last.sets.filter(s=>s.w||s.r).map(s=>`${s.w||'-'}×${s.r||'-'}`).join(', ') + '</b>'
      : '첫 기록이에요';
    let rows = '';
    for(let si=0; si<ex.s; si++){
      const wOn = si === 0 ? `onchange="flagCheck(${ei},0);sameW(${ei})"` : `onchange="flagCheck(${ei},${si})"`;
      const rOn = si === 0 ? `onchange="sameR(${ei})"` : '';
      rows += `<div class="set-row">
        <div class="set-no">${si+1}</div>
        <input type="number" step="0.5" inputmode="decimal" placeholder="${ex.t || 'kg'}" id="w-${ei}-${si}" ${wOn}>
        <input type="number" inputmode="numeric" placeholder="회" id="r-${ei}-${si}" ${rOn}>
        <button class="chk" id="c-${ei}-${si}" onclick="tick(${ei},${si})">✓</button>
      </div>
      <div class="flag" id="f-${ei}-${si}"></div>`;
    }
    rows += `<div class="same-row">
      <label><input type="checkbox" id="sw-${ei}" onchange="sameW(${ei})"> 무게 동일</label>
      <label><input type="checkbox" id="sr-${ei}" onchange="sameR(${ei})"> 횟수 동일</label>
    </div>`;
    html += `<div class="ex">
      <div class="ex-head"><span class="ex-name">${ex.n}</span><span class="ex-target">${ex.s}×${ex.r}${ex.t ? ' · 목표 '+ex.t+'kg' : ''}</span></div>
      <div class="last">${lastTxt}</div>
      ${rows}
    </div>`;
  });
  if(p.cardio){
    html += `<div class="cardio"><span>${p.cardio}</span><button class="chk" id="cardio-chk" onclick="this.classList.toggle('done')">✓</button></div>`;
  }
  html += `<button class="btn" onclick="finish()">운동 완료 · 저장</button>`;
  document.getElementById('workout').innerHTML = html;
  window.scrollTo({top:0});
}
function tick(ei,si){
  document.getElementById(`c-${ei}-${si}`).classList.toggle('done');
}
function sameW(ei){
  const box = document.getElementById('sw-'+ei);
  if(!box || !box.checked) return;
  const v = document.getElementById(`w-${ei}-0`).value;
  if(v === '') return;
  const n = PROGRAM[curDay].ex[ei].s;
  for(let si=1; si<n; si++){
    document.getElementById(`w-${ei}-${si}`).value = v;
    flagCheck(ei, si);
  }
}
function sameR(ei){
  const box = document.getElementById('sr-'+ei);
  if(!box || !box.checked) return;
  const v = document.getElementById(`r-${ei}-0`).value;
  if(v === '') return;
  const n = PROGRAM[curDay].ex[ei].s;
  for(let si=1; si<n; si++){
    document.getElementById(`r-${ei}-${si}`).value = v;
  }
}
function flagCheck(ei,si){
  const ex = PROGRAM[curDay].ex[ei];
  const last = lastSession(curDay, ex.n);
  const inp = document.getElementById(`w-${ei}-${si}`);
  const flag = document.getElementById(`f-${ei}-${si}`);
  inp.classList.remove('down','up'); flag.textContent=''; flag.className='flag';
  if(!last) return;
  const v = parseFloat(inp.value); if(!v) return;
  const prev = topWeight(last);
  if(!prev) return;
  if(v < prev){
    inp.classList.add('down'); flag.classList.add('down');
    flag.textContent = `지난 최고 ${prev}kg보다 ↓ — 커팅 중 중량 유지가 핵심!`;
  } else if(v > prev){
    inp.classList.add('up'); flag.classList.add('up');
    flag.textContent = `지난 최고 ${prev}kg 갱신 ↑`;
  }
}
async function finish(){
  const p = PROGRAM[curDay];
  const exercises = p.ex.map((ex,ei) => ({
    name: ex.n,
    sets: Array.from({length:ex.s}, (_,si) => ({
      w: document.getElementById(`w-${ei}-${si}`).value,
      r: document.getElementById(`r-${ei}-${si}`).value,
    }))
  }));
  const any = exercises.some(e => e.sets.some(s => s.w || s.r));
  if(!any){ toast('기록된 세트가 없어요'); return; }
  const cardioEl = document.getElementById('cardio-chk');
  DATA.sessions.push({
    date: today(), day: curDay, exercises,
    cardio: cardioEl ? cardioEl.classList.contains('done') : null,
  });
  await save();
  toast('저장 완료 💪');
  document.getElementById('workout').innerHTML = '';
  curDay = null; renderDays(); renderHist();
}

// ---------- 기록 ----------
function renderHist(){
  const el = document.getElementById('hist');
  if(!DATA.sessions.length){
    el.innerHTML = '<div class="empty">아직 기록이 없어요.<br>첫 운동을 저장하면 여기에 쌓입니다.</div>';
    return;
  }
  el.innerHTML = '<button class="btn ghost" style="margin-top:14px" onclick="exportReport()">📋 AI 코치용 리포트 복사</button>' + [...DATA.sessions].reverse().map((s, ri) => {
    const idx = DATA.sessions.length - 1 - ri;
    const rows = s.exercises
      .filter(e => e.sets.some(t => t.w || t.r))
      .map(e => `<div class="r"><span>${e.name}</span><span class="v">${e.sets.filter(t=>t.w||t.r).map(t=>`${t.w||'-'}×${t.r||'-'}`).join('  ')}</span></div>`).join('');
    const cardio = s.cardio === true ? '<div class="r"><span>유산소</span><span class="v">완료 ✓</span></div>' : '';
    return `<div class="sess" id="sess-${idx}">
      <div class="sess-head" onclick="document.getElementById('sess-${idx}').classList.toggle('open')">
        <span class="t">${s.day}</span><span class="d">${fmt(s.date)}</span>
      </div>
      <div class="sess-body">${rows}${cardio}
        <button class="del" onclick="delSess(${idx})">이 기록 삭제</button>
      </div>
    </div>`;
  }).join('');
}
async function delSess(idx){
  DATA.sessions.splice(idx,1);
  await save(); renderHist(); toast('삭제됨');
}

// ---------- AI 코치용 리포트 ----------
function buildReport(){
  const L = [];
  L.push('# 커팅 진행 리포트 (' + today() + ')');
  L.push('기본: 34세 남성, 177.5cm / 시작 73kg·체지방 16% → 목표 69kg·11%');
  L.push('식단: 아침 커피+달걀, 점심 닭가슴살+현미밥, 저녁 약 700~750kcal (단백질 하루 130g 목표)');
  L.push('');
  if(DATA.weights.length){
    L.push('## 체중 기록 (최근 10회)');
    DATA.weights.slice(-10).forEach(w => L.push('- ' + w.date + ': ' + w.kg + 'kg'));
    L.push('');
  }
  if(DATA.protein.length){
    L.push('## 단백질 섭취 (최근 10일, 목표 130g)');
    DATA.protein.slice(-10).forEach(p => L.push('- ' + p.date + ': ' + p.g + 'g' + (p.g >= 130 ? ' ✓' : '')));
    L.push('');
  }
  if(DATA.sessions.length){
    L.push('## 운동 기록 (최근 12세션)');
    DATA.sessions.slice(-12).forEach(s => {
      L.push('### ' + s.date + ' ' + s.day + (s.cardio === true ? ' (유산소 완료)' : ''));
      s.exercises.forEach(e => {
        const sets = e.sets.filter(t => t.w || t.r).map(t => (t.w || '-') + 'kg×' + (t.r || '-')).join(', ');
        if(sets) L.push('- ' + e.name + ': ' + sets);
      });
    });
  }
  return L.join('\n');
}
async function exportReport(){
  const txt = buildReport();
  try{
    await navigator.clipboard.writeText(txt);
    toast('리포트 복사됨 — 코치 프로젝트에 붙여넣으세요');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    toast('리포트 복사됨');
  }
}

// ---------- 단백질 ----------
async function addProtein(){
  const inp = document.getElementById('p-g');
  const v = parseInt(inp.value);
  if(!v || v < 10 || v > 400){ toast('그램 수를 확인해주세요'); return; }
  DATA.protein = DATA.protein.filter(p => p.date !== today());
  DATA.protein.push({date: today(), g: v});
  DATA.protein.sort((a,b) => a.date.localeCompare(b.date));
  inp.value = '';
  await save(); renderProtein();
  toast(v >= 130 ? '목표 달성 ✓ ' + v + 'g' : '기록됨 — 목표까지 ' + (130 - v) + 'g');
}
function renderProtein(){
  const el = document.getElementById('p-list');
  if(!DATA.protein.length){
    el.innerHTML = '<div class="empty" style="padding:20px 0">단백질 기록이 없어요.</div>';
    return;
  }
  el.innerHTML = [...DATA.protein].reverse().slice(0,14).map(p => {
    const ok = p.g >= 130;
    const badge = ok
      ? '<span class="diff down">✓ 목표 달성</span>'
      : '<span class="diff up">−' + (130 - p.g) + 'g</span>';
    return '<div class="w-row"><span class="d">' + fmt(p.date) + '</span><span>' + p.g + 'g' + badge + '</span></div>';
  }).join('');
}

// ---------- 체중 ----------
async function addWeight(){
  const inp = document.getElementById('w-kg');
  const v = parseFloat(inp.value);
  if(!v || v < 30 || v > 200){ toast('체중을 확인해주세요'); return; }
  DATA.weights = DATA.weights.filter(w => w.date !== today());
  DATA.weights.push({date: today(), kg: v});
  DATA.weights.sort((a,b)=>a.date.localeCompare(b.date));
  inp.value='';
  await save(); renderWeights(); toast('체중 기록 완료');
}
function renderWeights(){
  const list = document.getElementById('w-list');
  const svg = document.getElementById('chart');
  if(!DATA.weights.length){
    list.innerHTML = '<div class="empty">체중 기록이 없어요.</div>';
    svg.innerHTML=''; return;
  }
  list.innerHTML = [...DATA.weights].reverse().map((w,i,arr) => {
    const prev = arr[i+1];
    let diff = '';
    if(prev){
      const d = +(w.kg - prev.kg).toFixed(1);
      if(d < 0) diff = `<span class="diff down">${d}kg</span>`;
      else if(d > 0) diff = `<span class="diff up">+${d}kg</span>`;
    }
    return `<div class="w-row"><span class="d">${fmt(w.date)}</span><span>${w.kg.toFixed(1)}kg${diff}</span></div>`;
  }).join('');

  // 스파크라인 (최근 12개)
  const pts = DATA.weights.slice(-12);
  const min = Math.min(69, ...pts.map(p=>p.kg)) - 0.5;
  const max = Math.max(...pts.map(p=>p.kg)) + 0.5;
  const X = i => pts.length===1 ? 170 : 15 + i*(310/(pts.length-1));
  const Y = v => 125 - ((v-min)/(max-min))*110;
  const goalY = Y(69);
  let s = `<line x1="0" y1="${goalY}" x2="340" y2="${goalY}" stroke="#4CAF6D" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
           <text x="335" y="${goalY-5}" fill="#4CAF6D" font-size="9" text-anchor="end" font-family="monospace">목표 69kg</text>`;
  if(pts.length > 1){
    s += `<polyline fill="none" stroke="#4A90D9" stroke-width="2" points="${pts.map((p,i)=>`${X(i)},${Y(p.kg)}`).join(' ')}"/>`;
  }
  pts.forEach((p,i)=>{ s += `<circle cx="${X(i)}" cy="${Y(p.kg)}" r="3.5" fill="#4A90D9"/>`; });
  svg.innerHTML = s;
}

// ---------- 탭 ----------
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('tab-'+b.dataset.t).classList.add('on');
  };
});

load();
</script>
